version: 2
updates:
  # Keep the hash-pinned GitHub Actions current. Dependabot tracks the
  # version comment (e.g. `# v4`) next to each pinned SHA and opens PRs
  # that bump both the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
