name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

# Pin Wrangler to a single exact version everywhere so CI matches what
# you'd get running `npx wrangler@${WRANGLER_VERSION}` locally. Keep it in step
# with deploy.yml (scripts/test_previews.py checks they match).
env:
  WRANGLER_VERSION: "4.143.1"

jobs:
  cleanup:
    name: Delete preview
    runs-on: ubuntu-latest
    # Forks never had a preview deployed (secrets aren't exposed to PRs
    # from forks), so there's nothing to clean up.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The delete script and wrangler.toml (which names the Worker) come from
      # the commit this workflow runs from, so they always match it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # scripts/delete-preview.sh deletes the Worker Preview pr-<N>. It exits 0
      # when it was deleted or never existed and fails the job on anything
      # else, so a preview that's still live is never reported as already gone.
      - name: Delete preview
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: WRANGLER="npx --yes wrangler@${WRANGLER_VERSION}" sh scripts/delete-preview.sh "${PR_NUMBER}"

      - name: Update PR comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          RESULT: ${{ steps.delete.outcome }}
          DELETED: ${{ steps.delete.outputs.deleted }}
        with:
          script: |
            const marker = '<!-- preview-deployment -->';
            const previewName = process.env.PREVIEW_NAME;
            const action = context.payload.pull_request.merged ? 'merged' : 'closed';
            let status;
            if (process.env.RESULT !== 'success') {
              status = `Teardown of \`${previewName}\` failed, so it may still be live. See the PR Preview Cleanup run (PR ${action}).`;
            } else if (process.env.DELETED === 'true') {
              status = `Preview \`${previewName}\` torn down (PR ${action}).`;
            } else {
              status = `Preview \`${previewName}\` was already gone — nothing to tear down (PR ${action}).`;
            }
            const body = [
              marker,
              '### Cloudflare Workers preview',
              '',
              status,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
