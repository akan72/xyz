name: CI & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Pin Wrangler to a single exact version everywhere so CI matches what
# you'd get running `npx wrangler@${WRANGLER_VERSION}` locally. Worker
# Previews (`wrangler preview`) need 4.143.1 or later. pr-preview-cleanup.yml
# pins the same version (scripts/test_previews.py checks they match).
env:
  WRANGLER_VERSION: "4.143.1"

jobs:
  rust:
    name: Rust (fmt + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: cargo fmt --all --check

      - run: cargo check --lib --target wasm32-unknown-unknown

      - run: cargo test --lib

  site:
    name: Site (astro check + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The build dates each page in sitemap.xml by its last commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Type-checks site/ against the content collections' generated types
      - run: npm run check

      # Fails on a project that doesn't match its schema, or a page missing a
      # <title> or <meta name="description">
      - run: npm run build

      # Unit tests, then checks on the built dist/
      - run: npm test

      # The Worker Preview workflow tests
      - run: python3 -m unittest discover -s scripts

  endpoints:
    name: HTTP endpoints (local Worker)
    needs: [rust, site]
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Worker tools
        run: |
          npm ci
          cargo install worker-build --locked
          npm install --prefix /tmp/xyz-wrangler --no-save "wrangler@${WRANGLER_VERSION}"
          npm install --prefix /tmp/xyz-mcp-interop --no-audit --no-fund --ignore-scripts @modelcontextprotocol/sdk@1.32.1 @modelcontextprotocol/client@2.3.1

      - name: Verify HTTP endpoints
        run: |
          set -euo pipefail
          worker-build --release
          npm run build
          node /tmp/xyz-wrangler/node_modules/wrangler/bin/wrangler.js r2 object put cigawrette-packs/cig-collection/1.jpg --file public/assets/cig.jpg --local
          node /tmp/xyz-wrangler/node_modules/wrangler/bin/wrangler.js dev --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > /tmp/xyz-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/xyz-dev.log
            exit 1
          fi
          node scripts/verify-endpoints.ts http://127.0.0.1:8787 --cig-id=1
          node scripts/verify-mcp-clients.mjs http://127.0.0.1:8787 /tmp/xyz-mcp-interop

  deploy:
    name: Cloudflare Workers
    needs: [rust, site, endpoints]
    runs-on: ubuntu-latest
    # Secrets aren't exposed to PRs from forks; skip deploy there.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    # The Cloudflare secrets go only to the two steps that deploy, so
    # `cargo install` and the cache actions never see them.
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The wrangler build runs Astro, which dates pages from git history
          fetch-depth: 0
          persist-credentials: false

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Cache worker-build binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/worker-build
          key: ${{ runner.os }}-worker-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-worker-build-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # wrangler's [build] runs `npm run build` (Astro) before worker-build
      - name: Install npm dependencies
        run: npm ci

      # Production: push to the default branch → create-or-update the Worker
      # at its custom domains. `wrangler deploy` creates the script on first
      # run, so no separate bootstrap is needed. The private producer is
      # deployed here too; its refresh schedule runs on Cloudflare.
      - name: Deploy to production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Masks the token owner's email, as in the preview step.
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          : "${CLOUDFLARE_EMAIL:?the CLOUDFLARE_EMAIL secret is missing, so the log could show the email of the account that owns the token}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config workers/vesta/wrangler.toml --env ""
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy

      # Pull requests: a Worker Preview of the one xyz Worker, named pr-<N>,
      # at its own pr-<N>-xyz.<subdomain>.workers.dev URL. It builds from
      # wrangler.toml, whose [previews] block declares the bindings previews
      # get; previews never get the [[routes]], so a PR can't take the custom
      # domains or ship production. pr-preview-cleanup.yml deletes the
      # Preview when the PR closes.
      - name: Deploy PR preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler names the email of the account that owns the token, in
          # its JSON and after an authentication error, and these logs are
          # public. GitHub masks a secret anywhere in the log of a job that
          # uses it.
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_EMAIL:?the CLOUDFLARE_EMAIL secret is missing, so the log could show the email of the account that owns the token}"
          npx --yes "wrangler@${WRANGLER_VERSION}" preview --name "pr-${PR_NUMBER}" --json | tee /tmp/preview.log
          URL="$(sh scripts/preview-url.sh /tmp/preview.log)"
          echo "preview_name=pr-${PR_NUMBER}" >>"$GITHUB_OUTPUT"
          echo "preview_url=${URL}" >>"$GITHUB_OUTPUT"
          echo "::notice::Preview at ${URL}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.preview_url
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview_name }}
        with:
          script: |
            const marker = '<!-- preview-deployment -->';
            const previewUrl = process.env.PREVIEW_URL;
            const previewName = process.env.PREVIEW_NAME;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              '### Cloudflare Workers preview',
              '',
              `Preview deployed for commit \`${sha}\`:`,
              '',
              `- URL: ${previewUrl}`,
              `- Preview: \`${previewName}\` of the \`xyz\` Worker`,
              '',
              'This preview environment will be deleted when the PR is closed.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
