name: CI & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Pin Wrangler to a single exact version everywhere so CI matches what
# you'd get running `npx wrangler@${WRANGLER_VERSION}` locally. Worker
# Previews (`wrangler preview`) need 4.143.1 or later. pr-preview-cleanup.yml
# pins the same version (scripts/test_previews.py checks they match).
env:
  WRANGLER_VERSION: "4.143.1"

jobs:
  rust:
    name: Rust (fmt + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: cargo fmt --all --check

      - run: cargo check --lib --target wasm32-unknown-unknown

      - run: cargo test --lib

  site:
    name: Site files (sitegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # sitegen reads each page's last commit date for sitemap.xml
          fetch-depth: 0
          persist-credentials: false

      - run: python3 -m unittest discover -s scripts

      # Fails if a page is missing a <title> or <meta name="description">
      - run: python3 scripts/sitegen.py

  deploy:
    name: Cloudflare Workers
    needs: [rust, site]
    runs-on: ubuntu-latest
    # Secrets aren't exposed to PRs from forks; skip deploy there.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    # The Cloudflare secrets go only to the two steps that deploy, so
    # `cargo install` and the cache actions never see them.
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The wrangler build runs sitegen, which dates pages from git history
          fetch-depth: 0
          persist-credentials: false

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Cache worker-build binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/worker-build
          key: ${{ runner.os }}-worker-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-worker-build-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Production: push to the default branch → create-or-update the Worker
      # at its custom domains. `wrangler deploy` creates the script on first
      # run, so no separate bootstrap is needed. It's the only step that
      # deploys production.
      - name: Deploy to production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy

      # Pull requests: a Worker Preview of the one xyz Worker, named pr-<N>,
      # at its own pr-<N>-xyz.<subdomain>.workers.dev URL. It builds from
      # wrangler.toml, whose [previews] block declares the bindings previews
      # get; previews never get the [[routes]], so a PR can't take the custom
      # domains or ship production. pr-preview-cleanup.yml deletes the
      # Preview when the PR closes.
      - name: Deploy PR preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The JSON names the email of the account that owns the token and
          # these logs are public, so it goes to a file that only
          # scripts/preview-url.sh reads. On failure that script shows it with
          # every email address hidden.
          STATUS=0
          npx --yes "wrangler@${WRANGLER_VERSION}" preview --name "pr-${PR_NUMBER}" --json >/tmp/preview.log || STATUS=$?
          URL="$(sh scripts/preview-url.sh /tmp/preview.log)"
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::wrangler preview exited ${STATUS}"
            exit 1
          fi
          echo "preview_name=pr-${PR_NUMBER}" >>"$GITHUB_OUTPUT"
          echo "preview_url=${URL}" >>"$GITHUB_OUTPUT"
          echo "::notice::Preview at ${URL}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.preview_url
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview_name }}
        with:
          script: |
            const marker = '<!-- preview-deployment -->';
            const previewUrl = process.env.PREVIEW_URL;
            const previewName = process.env.PREVIEW_NAME;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              '### Cloudflare Workers preview',
              '',
              `Preview deployed for commit \`${sha}\`:`,
              '',
              `- URL: ${previewUrl}`,
              `- Preview: \`${previewName}\` of the \`xyz\` Worker`,
              '',
              'This preview environment will be deleted when the PR is closed.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
