repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
      - id: cargo-check-wasm
        name: cargo check --target wasm32-unknown-unknown
        entry: cargo check --target wasm32-unknown-unknown
        language: system
        pass_filenames: false
      - id: sitegen
        name: sitegen (tests + build dist/)
        entry: sh -c 'python3 -m unittest discover -s scripts -q && python3 scripts/sitegen.py'
        language: system
        pass_filenames: false
        files: ^(public|scripts)/
