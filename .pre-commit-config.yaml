repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
      - id: cargo-check-wasm
        name: cargo check --target wasm32-unknown-unknown
        entry: cargo check --target wasm32-unknown-unknown
        language: system
        pass_filenames: false
      - id: site
        name: site (astro build + tests)
        entry: sh -c 'npm run build --silent && npm test --silent && python3 -m unittest discover -s scripts -q'
        language: system
        pass_filenames: false
        files: ^(public|site|scripts)/|^astro\.config\.ts$|^package(-lock)?\.json$
