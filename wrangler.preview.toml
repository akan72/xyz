# Preview-only wrangler config used by .github/workflows/deploy.yml for
# PR previews. Mirrors wrangler.toml exactly except the [[routes]]
# blocks are omitted so each PR Worker publishes only to its
# <name>.<subdomain>.workers.dev URL and cannot deploy to the production
# custom domain. The Worker name is passed via `--name` at deploy
# time (e.g. `--name xyz-pr-5`); the `name` field below is a
# placeholder that gets overridden.
name = "xyz"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[build]
# sitegen.py writes dist/: public/ plus llms.txt, sitemaps and Markdown copies of pages
command = "command -v worker-build >/dev/null 2>&1 || cargo install worker-build; worker-build --release --no-opt && python3 scripts/sitegen.py"
watch_dir = ["src", "public", "scripts"]

[assets]
# Built from public/ by scripts/sitegen.py (see [build])
directory = "./dist"
binding = "ASSETS"
# Missing paths get 404.html with a 404 status
not_found_handling = "404-page"
# Paths without a file extension (pages, /image, /cig/*) run the Worker first,
# so it can add link-preview tags (src/link_preview.rs) and answer
# `Accept: text/markdown` with a page's Markdown copy. Paths with one
# (images, .md, .txt, .xml) are served straight from assets.
run_worker_first = ["/*", "!/*.*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cigawrette-packs"

[observability]
enabled = true
