<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="/assets/theme.js"></script>
        <link rel="stylesheet" href="/assets/typography.css">
        <title>alexkan.xyz</title>
        <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
        <meta name="description" content="Alex Kan's personal website.">
        <script type="module" src="/assets/screensaver.js"></script>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "WebSite",
                        "name": "alexkan.xyz",
                        "url": "https://alexkan.xyz/"
                    },
                    {
                        "@type": "ProfilePage",
                        "url": "https://alexkan.xyz/",
                        "mainEntity": {
                            "@type": "Person",
                            "name": "Alex Kan",
                            "url": "https://alexkan.xyz/"
                        }
                    }
                ]
            }
        </script>
        <style>
            :root { color-scheme: light; --bg: #f4f4f4; --fg: #111; --nav: #333; }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) { color-scheme: dark; --bg: #161616; --fg: #e8e8e8; --nav: #c8c8c8; }
            }
            :root[data-theme="dark"] { color-scheme: dark; --bg: #161616; --fg: #e8e8e8; --nav: #c8c8c8; }
            body { background: var(--bg); color: var(--fg); }
            .milady { display: block; width: 260px; max-width: 100%; height: auto; margin: 0 0 16px; }
            button { font: inherit; cursor: pointer; }
            /* Dark mode: outline the cig button instead of the browser's gray fill; light mode keeps the native button */
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) .cig-button { background: transparent; color: var(--fg); border: 1px solid #6a6a6a; border-radius: 4px; padding: 2px 7px; }
                :root:not([data-theme="light"]) .cig-button:hover { border-color: #9a9a9a; }
            }
            :root[data-theme="dark"] .cig-button { background: transparent; color: var(--fg); border: 1px solid #6a6a6a; border-radius: 4px; padding: 2px 7px; }
            :root[data-theme="dark"] .cig-button:hover { border-color: #9a9a9a; }
            .cig-box { display: inline-flex; flex-direction: column; align-items: center; }
            .cig { display: block; width: 260px; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; margin-top: 12px; }
        </style>
        <link rel="stylesheet" href="/assets/navigation.css">
        <link rel="stylesheet" href="/assets/transitions.css">
        <script src="/assets/page-navigation.js" defer></script>
    </head>
    <body>
        <header class="site-header">
            <h2>alexkan.xyz</h2>
            <nav aria-label="Primary">
                <a href="/" aria-current="page">Main</a>
                <a href="/ideology">Ideology</a>
                <a href="/projects">Projects</a>
                <a href="/contact">Contact</a>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
            </nav>
        </header>
        <main>
            <img id="milady" class="milady" src="./assets/milady.jpg" alt="Milady" width="410" height="512">
            <div class="cig-box">
                <button id="cig-button" class="cig-button" onclick="
                    const btn = this;
                    btn.disabled = true;
                    fetch('/image')
                        .then(r => r.text())
                        .then(url => {
                            const temp = new Image();
                            temp.onload = () => {
                                document.getElementById('cig').src = url;
                                btn.disabled = false;
                            };
                            temp.src = url;
                        });
                ">
                    Get Random Cig
                </button>
                <img id="cig" class="cig" src="./assets/cig.jpg" alt="Cigawrette">
            </div>
        </main>
    </body>
</html>
