<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>alexkan.xyz</title>
        <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
        <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
        <meta name="theme-color" content="#f4f4f4">
        <meta name="description" content="Alex Kan's personal website.">
        <!-- Link previews (iMessage, Slack, Discord, etc.). Scrapers need absolute URLs. -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="alexkan.xyz">
        <meta property="og:locale" content="en_US">
        <meta property="og:title" content="alexkan.xyz">
        <meta property="og:description" content="Alex Kan's personal website.">
        <meta property="og:url" content="https://alexkan.xyz/">
        <meta property="og:image" content="https://alexkan.xyz/assets/og.jpg">
        <meta property="og:image:type" content="image/jpeg">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="alexkan.xyz, Alex Kan's personal website">
        <!-- X reads twitter:*; set explicitly rather than relying on its og:* fallback -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="alexkan.xyz">
        <meta name="twitter:description" content="Alex Kan's personal website.">
        <meta name="twitter:image" content="https://alexkan.xyz/assets/og.jpg">
        <meta name="twitter:image:alt" content="alexkan.xyz, Alex Kan's personal website">
        <style>
            body { background: #f4f4f4; color: #111; font-family: Georgia, "Times New Roman", serif; margin: 0; }
            main { max-width: 720px; margin: 40px auto; padding: 0 16px; }
            h2 { margin: 0 0 24px; }
            nav a { color: #333; margin-right: 14px; }
            #milady { display: block; width: 260px; max-width: 100%; height: auto; margin: 32px 0 16px; }
            button { font: inherit; cursor: pointer; }
            .cig-box { display: inline-flex; flex-direction: column; align-items: center; }
            #cig { display: block; width: 260px; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; margin-top: 12px; }
        </style>
    </head>
    <body>
        <main>
            <h2>alexkan.xyz</h2>
            <nav>
                <a href="/ideology.html">Ideology</a>
                <a href="/projects.html">Projects</a>
                <a href="/contact.html">Contact</a>
            </nav>
            <img id="milady" src="./assets/milady.jpg" alt="Milady">
            <div class="cig-box">
                <button onclick="
                    const btn = this;
                    btn.disabled = true;
                    fetch('/image')
                        .then(r => r.text())
                        .then(url => {
                            const temp = new Image();
                            temp.onload = () => {
                                document.getElementById('cig').src = url;
                                btn.disabled = false;
                            };
                            temp.src = url;
                        });
                ">
                    Get Random Cig
                </button>
                <img id="cig" src="./assets/cig.jpg" alt="Cigawrette">
            </div>
        </main>
    </body>
</html>
