<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>alexkan.xyz</title>
        <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
        <style>
            body { background: #f4f4f4; color: #111; font-family: Georgia, "Times New Roman", serif; margin: 0; }
            main { max-width: 720px; margin: 40px auto; padding: 0 16px; }
            h2 { margin: 0 0 24px; }
            nav a { color: #333; margin-right: 14px; }
            #milady { display: block; width: 260px; max-width: 100%; height: auto; margin: 32px 0 16px; }
            button { font: inherit; cursor: pointer; }
            .cig-box { display: inline-flex; flex-direction: column; align-items: center; }
            #cig { display: block; width: 240px; aspect-ratio: 4 / 5; object-fit: cover; margin-top: 12px; }
        </style>
    </head>
    <body>
        <main>
            <h2>alexkan.xyz</h2>
            <nav>
                <a href="/ideology.html">Ideology</a>
                <a href="/projects.html">Projects</a>
                <a href="/contact.html">Contact</a>
            </nav>
            <img id="milady" src="./assets/milady.jpg" alt="Milady">
            <div class="cig-box">
                <button onclick="
                    const btn = this;
                    btn.disabled = true;
                    fetch('/image')
                        .then(r => r.text())
                        .then(url => {
                            const temp = new Image();
                            temp.onload = () => {
                                document.getElementById('cig').src = url;
                                btn.disabled = false;
                            };
                            temp.src = url;
                        });
                ">
                    Get Random Cig
                </button>
                <img id="cig" src="./assets/cig.jpg" alt="Cigawrette">
            </div>
        </main>
    </body>
</html>
