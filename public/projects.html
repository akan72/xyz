<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="/assets/theme.js"></script>
        <title>Projects | alexkan.xyz</title>
        <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
        <meta name="description" content="Things I've built.">
        <link rel="preconnect" href="https://istheldown.com">
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
        <script>
            // Open the istheldown feed and fetch the station table right away, before the
            // renderer has loaded; assets/subway-vis.js picks these up (messages are queued).
            window.__subway = (function () {
                try {
                    var s = { ws: new WebSocket('wss://istheldown.com/ws?systems=subway&alerts=subway'), queue: [], closed: null, t0: performance.now() };
                    s.onmsg = function (e) { s.queue.push(e.data); };
                    s.ws.addEventListener('message', s.onmsg);
                    s.ws.addEventListener('close', function (e) { s.closed = e.code; });
                    s.stations = fetch('/assets/subway-stations.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
                    s.stations.catch(function () {});
                    return s;
                } catch (e) { return null; }
            })();
        </script>
        <script id="hydra-script" src="https://cdn.jsdelivr.net/npm/hydra-synth@1.4.0/dist/hydra-synth.js" async onerror="window.__hydraFailed = true"></script>
        <script src="/assets/subway-vis.js" defer></script>
        <script type="module" src="/assets/screensaver.js"></script>
        <style>
            :root { color-scheme: light; }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) { color-scheme: dark; --bg: #161616; --fg: #e8e8e8; --link: #8ab4f8; --visited: #c58af9; --muted: #9a9a9a; }
            }
            :root[data-theme="dark"] { color-scheme: dark; --bg: #161616; --fg: #e8e8e8; --link: #8ab4f8; --visited: #c58af9; --muted: #9a9a9a; }
            body { max-width: 720px; margin: 40px auto; padding: 0 16px; background: var(--bg, Canvas); color: var(--fg, CanvasText); }
            a { color: var(--link, LinkText); }
            a:visited { color: var(--visited, VisitedText); }
            /* The stack line under each description */
            .meta { color: var(--muted, #666); font-size: 0.9em; margin-top: -0.4em; }
            /* The live istheldown figure: same 260px width as the images on the homepage */
            .figs { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin-top: 1em; }
            .fig { width: 260px; max-width: 100%; aspect-ratio: 4 / 5; background: #111; }
            .fig.map { background: #000; }
            .fig canvas { display: block; width: 100%; height: 100%; }
            .bullet { width: 1.4em; height: 1.4em; vertical-align: middle; }
            /* Wrap descriptions at the right edge of the figure and map (2 x 260px + 16px gap),
               and never past 70ch in case the font gets wider */
            ul p { max-width: min(536px, 70ch); }
        </style>
    </head>
    <body>
        <h2> Projects </h2>
        <ul>
            <!-- sitegen:projects (rendered from scripts/projects.py) -->
        </ul>
        <br>
        <nav><a href="/">Home</a></nav>
    </body>
</html>
