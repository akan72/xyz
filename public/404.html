        <style>
            ::-moz-selection {
                background: #b3d4fc;
                text-shadow: none;
            }

            ::selection {
                background: #b3d4fc;
                text-shadow: none;
            }

            :root {
                color-scheme: light;
                --text: #737373;
                --page: #f0f0f0;
                --card: #fcfcfc;
                --border: #b3b3b3;
                --shadow: 0 1px 10px #a7a7a7, inset 0 1px 0 #fff;
                --heading: #737373;
                --heading-muted: #bbb;
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --text: #a8a8a8;
                    --page: #161616;
                    --card: #1f1f1f;
                    --border: #333;
                    --shadow: 0 1px 10px #000, inset 0 1px 0 #2a2a2a;
                    --heading: #e8e8e8;
                    --heading-muted: #666;
                }
            }

            :root[data-theme="dark"] {
                color-scheme: dark;
                --text: #a8a8a8;
                --page: #161616;
                --card: #1f1f1f;
                --border: #333;
                --shadow: 0 1px 10px #000, inset 0 1px 0 #2a2a2a;
                --heading: #e8e8e8;
                --heading-muted: #666;
            }

            html {
                padding: 0;
                font-size: 16px;
                line-height: normal;
                color: var(--text);
                background: var(--page);
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }

            .error-card {
                color: var(--text);
                font-size: 20px;
                line-height: 1.4;
                max-width: 500px;
                padding: 30px 20px 50px;
                border: 1px solid var(--border);
                border-radius: 4px;
                margin: 0 auto;
                box-shadow: var(--shadow);
                background: var(--card);
            }

            h1 {
                margin: 0 10px;
                font-size: 50px;
                text-align: center;
                color: var(--heading);
            }

            .error-card img { display: block; max-width: 100%; height: auto; }

            h1 span {
                white-space: nowrap;
                color: var(--heading-muted);
            }

            h3 {
                margin: 1.5em 0 0.5em;
            }

            p {
                margin: 1em 0;
            }

            ul {
                padding: 0 0 0 40px;
                margin: 1em 0;
            }

            .container {
                max-width: 380px;
                _width: 380px;
                margin: 0 auto;
            }

            /* google search */

            #goog-fixurl ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            #goog-fixurl form {
                margin: 0;
            }

            #goog-wm-qt,
            #goog-wm-sb {
                border: 1px solid #bbb;
                font-size: 16px;
                line-height: normal;
                vertical-align: top;
                color: #444;
                border-radius: 2px;
            }

            #goog-wm-qt {
                width: 220px;
                height: 20px;
                padding: 5px;
                margin: 5px 10px 0 0;
                box-shadow: inset 0 1px 1px #ccc;
            }

            #goog-wm-sb {
                display: inline-block;
                height: 32px;
                padding: 0 10px;
                margin: 5px 0 0;
                white-space: nowrap;
                cursor: pointer;
                background-color: #f5f5f5;
                background-image: -webkit-linear-gradient(rgba(255,255,255,0), #f1f1f1);
                background-image: -moz-linear-gradient(rgba(255,255,255,0), #f1f1f1);
                background-image: -ms-linear-gradient(rgba(255,255,255,0), #f1f1f1);
                background-image: -o-linear-gradient(rgba(255,255,255,0), #f1f1f1);
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                *overflow: visible;
                *display: inline;
                *zoom: 1;
            }

            #goog-wm-sb:hover,
            #goog-wm-sb:focus {
                border-color: #aaa;
                box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
                background-color: #f8f8f8;
            }

            #goog-wm-qt:hover,
            #goog-wm-qt:focus {
                border-color: #105cb6;
                outline: 0;
                color: #222;
            }

            input::-moz-focus-inner {
                padding: 0;
                border: 0;
            }
        </style>
